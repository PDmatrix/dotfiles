onboarding = false
[keys]
prefix = "ctrl+s"

[theme]
name = "catppuccin"
auto_switch = true

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"

[ui.sidebar.agents]
rows = [
  ["state_icon", "state_text"],
  ["workspace"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[terminal]
new_cwd = "follow"
